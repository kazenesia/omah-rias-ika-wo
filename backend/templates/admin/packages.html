<!doctype html>
<html lang="id" x-data="{ sidebarOpen: false, currentPage: 'packages' }">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Package Management - Admin Omah Rias Ika</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                50: "#FDF8E6",
                100: "#FBF1CD",
                200: "#F6E39B",
                300: "#F1D569",
                400: "#D4AF37" /* Base Champagne Gold */,
                500: "#B38F24",
                600: "#92741D",
              },
              charcoal: "#062D24" /* Deep Emerald */,
              "warm-white": "#FDFCF8" /* Ivory Silk */,
              "white-smoke": "#F5F5F5",
              slate: "#2C3E50" /* Midnight Slate */,
            },
            fontFamily: {
              display: ["Playfair Display", "serif"],
              body: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body class="font-body bg-cream text-espresso">
    <div class="min-h-screen">
      <!-- Mobile Sidebar Overlay -->
      <div
        x-show="sidebarOpen"
        x-transition:enter="transition-opacity ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition-opacity ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-black/50 z-40 lg:hidden"
        @click="sidebarOpen = false"
      ></div>

      <!-- Sidebar -->
      <aside
        :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
        class="fixed top-0 left-0 h-full w-64 admin-sidebar text-white z-50 transition-transform duration-300 lg:translate-x-0"
      >
        <!-- Logo -->
        <div
          class="p-4 border-b border-charcoal/20 flex items-center justify-between"
        >
          <div class="flex items-center space-x-2">
            <span class="text-2xl">💒</span>
            <span class="font-display text-xl font-bold text-rosegold-light"
              >Omah Rias Ika</span
            >
          </div>
          <button
            @click="sidebarOpen = false"
            class="lg:hidden p-1 hover:bg-gray-700 rounded"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <!-- Navigation -->
        <nav class="p-4 space-y-2">
          <a
            href="/admin-panel/dashboard/"
            :class="currentPage === 'dashboard' ? 'bg-wine/20 text-rosegold-light' : 'text-slate-300 hover:bg-wine/10 hover:text-gold-100 transition'"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            <span>Dashboard</span>
          </a>
          <a
            href="/admin-panel/orders/"
            :class="currentPage === 'orders' ? 'bg-wine/20 text-rosegold-light' : 'text-slate-300 hover:bg-wine/10 hover:text-gold-100 transition'"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
              />
            </svg>
            <span>Orders</span>
          </a>
          <a
            href="/admin-panel/catalog/"
            :class="currentPage === 'catalog' ? 'bg-wine/20 text-rosegold-light' : 'text-slate-300 hover:bg-wine/10 hover:text-gold-100 transition'"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
              />
            </svg>
            <span>Katalog</span>
          </a>
          <a
            href="/admin-panel/packages/"
            :class="currentPage === 'packages' ? 'bg-wine/20 text-rosegold-light' : 'text-slate-300 hover:bg-wine/10 hover:text-gold-100 transition'"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
              />
            </svg>
            <span>Paket</span>
          </a>
          <a
            href="/admin-panel/gallery/"
            :class="currentPage === 'gallery' ? 'bg-wine/20 text-rosegold-light' : 'text-slate-300 hover:bg-wine/10 hover:text-gold-100 transition'"
            class="flex items-center space-x-3 px-4 py-3 rounded-xl"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
            <span>Gallery</span>
          </a>
          <div class="pt-4 mt-4 border-t border-gray-700">
            <form method="post" action="/admin-panel/logout/">
              {% csrf_token %}
              <button
                type="submit"
                class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-red-500/20 hover:text-red-400 transition"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                  />
                </svg>
                <span>Logout</span>
              </button>
            </form>
          </div>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="lg:ml-64 min-h-screen">
        <!-- Top Bar -->
        <header
          class="bg-cream shadow-sm sticky top-0 z-20 border-b border-gray-200/50"
        >
          <div class="flex items-center justify-between px-4 sm:px-6 py-4">
            <div class="flex items-center space-x-3">
              <button
                @click="sidebarOpen = true"
                class="lg:hidden p-2 hover:bg-gray-100 rounded-lg transition"
              >
                <svg
                  class="w-6 h-6 text-gray-500"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"
                  />
                </svg>
              </button>
              <h1 class="text-lg sm:text-xl font-semibold text-espresso">
                Package Management
              </h1>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-4">
              <button
                class="relative p-2 hover:bg-gray-100 rounded-lg transition"
              >
                <svg
                  class="w-5 h-5 text-gray-500"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                  />
                </svg>
                <span
                  class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"
                ></span>
              </button>
              <div class="flex items-center space-x-2">
                <div
                  class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-wine flex items-center justify-center text-white font-semibold text-sm"
                >
                  A
                </div>
                <span class="hidden sm:block text-sm font-medium text-espresso"
                  >Admin</span
                >
              </div>
            </div>
          </div>
        </header>

        <!-- Packages Content -->
        <div class="p-6" x-data="adminPackages()">
          <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
            <template x-for="pkg in packages" :key="pkg.id">
            <div
              class="bg-white rounded-xl sm:rounded-2xl p-4 sm:p-6 shadow-md border hover:shadow-lg transition-shadow relative overflow-hidden group"
              :class="pkg.is_popular ? 'border-gold-400 shadow-xl' : 'border-gold-400/20'"
            >
              <template x-if="pkg.is_popular">
                 <div class="absolute top-0 right-0 bg-wine text-white text-[10px] font-bold px-3 py-1 uppercase tracking-wider">
                   Popular
                 </div>
              </template>
              <div class="flex items-center justify-between mb-4">
                <template x-if="pkg.icon">
                   <img :src="pkg.icon" :alt="pkg.name + ' Icon'" class="w-8 h-8 opacity-80" />
                </template>
                <span class="text-xl font-bold text-espresso" x-text="pkg.name"></span>
              </div>
              <p class="text-2xl font-bold text-rosegold-light mb-4">
                <template x-if="pkg.price > 0">
                   <span x-text="formatCurrency(pkg.price)"></span>
                </template>
                <template x-if="!pkg.price || pkg.price == 0">
                   <span>Custom</span>
                </template>
              </p>
              <ul class="text-sm text-slate-500 space-y-1 mb-6">
                <template x-for="(feature, idx) in pkg.features" :key="idx">
                   <li x-text="'✓ ' + feature"></li>
                </template>
              </ul>
              <button
                @click="openEditModal(pkg)"
                class="w-full py-2.5 border-2 border-gold-400/30 text-rosegold-light rounded-xl font-semibold hover:bg-wine hover:text-white transition-all shadow-sm hover:shadow-md"
              >
                Edit
              </button>
            </div>
            </template>
            <template x-if="packages.length === 0">
               <p class="text-slate-500">No packages found.</p>
            </template>
          </div>

          <!-- Edit Modal -->
          <div 
            x-show="showModal" 
            style="display: none;"
            class="fixed inset-0 z-50 flex items-center justify-center"
          >
            <div class="fixed inset-0 bg-black/50" @click="closeModal()"></div>
            <div class="bg-white rounded-2xl p-6 w-full max-w-lg z-10 shadow-2xl relative max-h-[90vh] overflow-y-auto">
              <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-espresso">Edit Package</h2>
                <button @click="closeModal()" class="text-gray-400 hover:text-gray-600">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              </div>
              
              <div class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Nama Paket</label>
                  <input type="text" x-model="formData.name" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-gold-400 focus:border-transparent" />
                </div>

                <div class="grid grid-cols-2 gap-4">
                   <div>
                      <label class="block text-sm font-medium text-gray-700 mb-1">Harga (Angka)</label>
                      <input type="number" x-model="formData.price" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-gold-400 focus:border-transparent" />
                   </div>
                   <div class="flex flex-col justify-center pt-6">
                      <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" x-model="formData.is_popular" class="form-checkbox h-5 w-5 text-gold-500 rounded border-gray-300 focus:ring-gold-400">
                        <span class="text-sm font-medium text-gray-700">Tandai "Popular"</span>
                      </label>
                   </div>
                </div>

                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Fitur (Satu baris per fitur)</label>
                  <textarea x-model="formData.featuresText" rows="6" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-gold-400 focus:border-transparent"></textarea>
                </div>
                
                <div class="mt-6 flex space-x-3">
                  <button @click="closeModal()" class="flex-1 py-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition font-medium">Batal</button>
                  <button @click="saveItem()" class="flex-1 py-2 admin-sidebar text-white rounded-lg hover:bg-[#0a4033] transition font-medium">Simpan</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script id="packages-data" type="application/json">
      {{ packages_json|safe }}
    </script>

    <script>
      function adminPackages() {
        return {
          sidebarOpen: false,
          packages: [],
          showModal: false,
          editingItem: null,
          formData: {
            name: '',
            price: 0,
            featuresText: '',
            is_popular: false
          },

          init() {
            try {
              const dataEl = document.getElementById("packages-data");
              if (dataEl) {
                this.packages = JSON.parse(dataEl.textContent);
              }
            } catch (e) {
              console.error("Failed to parse package data:", e);
            }
          },

          formatCurrency(amount) {
            return new Intl.NumberFormat('id-ID', { 
               style: 'currency', 
               currency: 'IDR', 
               minimumFractionDigits: 0 
            }).format(amount);
          },

          openEditModal(pkg) {
            this.editingItem = pkg;
            this.formData = {
              name: pkg.name,
              price: pkg.price || 0,
              featuresText: pkg.features ? pkg.features.join('\n') : '',
              is_popular: pkg.is_popular || false
            };
            this.showModal = true;
          },

          closeModal() {
            this.showModal = false;
          },

          async saveItem() {
            try {
               let cookie = document.cookie.match(/(^|;) ?csrftoken=([^;]*)(;|$)/);
               let csrfToken = cookie ? cookie[2] : "";
               
               let payload = {
                  name: this.formData.name,
                  price: this.formData.price,
                  is_popular: this.formData.is_popular,
                  features: this.formData.featuresText.split('\n').map(l => l.trim()).filter(l => l.length > 0)
               };

               const res = await fetch(`/admin-panel/packages/${this.editingItem.id}/edit/`, {
                  method: "POST",
                  headers: { "X-CSRFToken": csrfToken, "Content-Type": "application/json" },
                  body: JSON.stringify(payload)
               });
               
               const data = await res.json();
               if (data.success) {
                  const idx = this.packages.findIndex(i => i.id === this.editingItem.id);
                  if (idx !== -1) {
                     this.packages[idx] = data.package;
                  }
                  
                  this.closeModal();
                  Swal.fire({
                     icon: 'success',
                     title: 'Berhasil!',
                     text: 'Paket berhasil diperbarui.',
                     timer: 1500,
                     showConfirmButton: false
                  });
               } else {
                  Swal.fire({
                     icon: 'error',
                     title: 'Gagal',
                     text: data.error || "Gagal menyimpan paket."
                  });
               }
            } catch (e) {
               Swal.fire({
                  icon: 'error',
                  title: 'Error',
                  text: 'Terjadi kesalahan saat menghubungi server.'
               });
            }
          }
        };
      }
    </script>
  </body>
</html>
