<nav

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Beranda</a>

        <a href="/paket/" class="nav-link {% if '/paket' in request.path %}active{% endif %}">Paket</a>
