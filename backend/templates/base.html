<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block meta_description %}Omah Rias Ika — Wedding Organizer & Rias Pengantin profesional di Pasuruan. Paket lengkap, vendor terpercaya.{% endblock %}" />
  <title>{% block title %}Omah Rias Ika{% endblock %}</title>

  {% include 'partials/tailwind_config.html' %}

  <link rel="icon" type="image/webp" href="/static/assets/logo/logo-angen2-wo3.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />

  {% block extra_head %}{% endblock %}

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/ui.js"></script>
</head>

<body class="font-body bg-cream text-espresso grain {% block body_class %}{% endblock %}" x-data>
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-[100] focus:bg-wine focus:text-white focus:px-4 focus:py-2 focus:rounded-lg">Skip to content</a>

  {% include 'partials/nav.html' %}

  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  {% block footer %}
    {% include 'partials/footer.html' %}
  {% endblock %}

  {% block extra_scripts %}{% endblock %}
</body>
</html>
